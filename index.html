<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小一加減法樂園</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #9EE7FF, #D8C7FF, #FFF0A8, #FFBFD7, #B9F6D2);
    background-size: 400% 400%;
    animation: skyShift 16s ease-in-out infinite;
    font-family: 'Baloo 2', 'Chalkboard SE', 'Comic Sans MS', ui-rounded, sans-serif;
    padding: 20px;
    overflow: hidden;
  }
  @keyframes skyShift { 0%,100%{background-position:0% 45%} 50%{background-position:100% 55%} }
  .world-bg { position:fixed; inset:0; overflow:hidden; pointer-events:none; }
  .aurora { position:absolute; width:62vw; height:62vw; border-radius:50%; filter:blur(32px); opacity:.3; animation:auroraMove 12s ease-in-out infinite alternate; }
  .aurora.one { left:-18vw; top:-24vw; background:#31D7FF; }
  .aurora.two { right:-20vw; bottom:-28vw; background:#FF4FA3; animation-delay:-5s; }
  @keyframes auroraMove { to { transform:translate(12vw,9vh) scale(1.18); } }
  .rainbow { position:absolute; width:310px; height:155px; border:22px solid rgba(255,255,255,.28); border-bottom:0; border-radius:310px 310px 0 0; right:-55px; top:5vh; transform:rotate(8deg); box-shadow:0 -18px 0 rgba(255,103,146,.22),0 -36px 0 rgba(255,202,68,.22),0 -54px 0 rgba(75,210,152,.20),0 -72px 0 rgba(83,150,255,.18); animation:rainbowFloat 7s ease-in-out infinite; }
  @keyframes rainbowFloat { 50%{transform:translateY(14px) rotate(5deg)} }
  .bg-cloud { position:absolute; font-size:clamp(3rem,8vw,6rem); opacity:.48; filter:drop-shadow(0 8px 10px rgba(73,129,180,.12)); animation:cloudAcross linear infinite; }
  .bg-cloud.c1{top:8%;left:-140px;animation-duration:31s}.bg-cloud.c2{top:34%;left:-180px;animation-duration:43s;animation-delay:-18s;font-size:4rem}.bg-cloud.c3{top:68%;left:-130px;animation-duration:36s;animation-delay:-7s;font-size:3.4rem}
  @keyframes cloudAcross { to{transform:translateX(calc(100vw + 280px))} }
  .float-item { position:absolute; bottom:-70px; opacity:.58; animation:floatUp linear infinite; filter:drop-shadow(0 5px 7px rgba(50,80,120,.14)); }
  @keyframes floatUp { 0%{transform:translateY(0) rotate(0);opacity:0} 12%{opacity:.62} 88%{opacity:.62} 100%{transform:translateY(calc(-100vh - 120px)) rotate(28deg);opacity:0} }
  .spark { position:absolute; color:white; text-shadow:0 0 12px #fff,0 0 20px #ffe66d; animation:twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{transform:scale(.55) rotate(0);opacity:.25} 50%{transform:scale(1.35) rotate(35deg);opacity:.95} }
  .ferris-wheel { position:absolute; width:230px; height:230px; left:-86px; bottom:5vh; border:8px solid rgba(255,255,255,.48); box-shadow:0 0 0 5px rgba(124,92,231,.16),inset 0 0 0 3px rgba(255,202,68,.22); border-radius:50%; animation:spin 22s linear infinite; }
  .ferris-wheel::before,.ferris-wheel::after{content:"";position:absolute;left:50%;top:50%;background:rgba(255,255,255,.5);transform-origin:center}
  .ferris-wheel::before{width:210px;height:5px;transform:translate(-50%,-50%)}
  .ferris-wheel::after{width:5px;height:210px;transform:translate(-50%,-50%)}
  .ferris-wheel span{position:absolute;font-size:2.2rem;animation:counterSpin 22s linear infinite}.ferris-wheel span:nth-child(1){top:-22px;left:88px}.ferris-wheel span:nth-child(2){right:-20px;top:88px}.ferris-wheel span:nth-child(3){bottom:-22px;left:88px}.ferris-wheel span:nth-child(4){left:-20px;top:88px}
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes counterSpin { to{transform:rotate(-360deg)} }
  .pennants{position:absolute;left:0;right:0;top:0;height:42px;display:flex;justify-content:center;gap:5px;filter:drop-shadow(0 4px 4px rgba(90,70,120,.12));animation:pennantSway 3s ease-in-out infinite alternate}
  .pennants span{width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:28px solid #ff6b8a}.pennants span:nth-child(2n){border-top-color:#ffd34e}.pennants span:nth-child(3n){border-top-color:#4ed6a3}.pennants span:nth-child(4n){border-top-color:#6b9cff}.pennants span:nth-child(5n){border-top-color:#a879ef}
  @keyframes pennantSway{to{transform:translateY(4px) rotate(.5deg)}}
  .school-bus{position:absolute;right:4vw;bottom:5vh;font-size:4rem;animation:busRide 7s ease-in-out infinite;filter:drop-shadow(0 8px 8px rgba(100,80,40,.18))}
  @keyframes busRide{0%,100%{transform:translateX(0) rotate(-1deg)}50%{transform:translateX(-35px) translateY(-5px) rotate(1deg)}}
  .paper-plane{position:absolute;left:-60px;top:22%;font-size:2.4rem;animation:planeFly 14s linear infinite;filter:drop-shadow(0 5px 5px rgba(70,100,150,.2))}
  @keyframes planeFly{to{transform:translate(calc(100vw + 120px),-12vh) rotate(16deg)}}
  .wave { position:absolute; left:-10%; bottom:-55px; width:120%; height:120px; border-radius:45% 55% 0 0; background:rgba(56,189,248,.20); animation:waveSway 6s ease-in-out infinite alternate; }
  .wave.w2 { bottom:-78px; background:rgba(52,211,153,.23); animation-delay:-3s; }
  @keyframes waveSway { to{transform:translateX(4%) translateY(-12px) rotate(1deg)} }
  .app {
    position: relative;
    width: 100%;
    max-width: 480px;
    min-height: 560px;
    overflow: hidden;
    border-radius: 24px;
    padding: 24px;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.5);
    box-shadow:0 22px 70px rgba(65,86,140,.22);
    backdrop-filter:blur(5px);
  }
  .brand-strip { position:relative; z-index:11; display:flex; justify-content:center; margin:-8px 0 10px; }
  .brand-pill { display:flex; align-items:center; gap:8px; background:linear-gradient(90deg,#1678C8,#7C5CE7); color:white; padding:6px 14px; border-radius:999px; font-size:.83rem; font-weight:800; letter-spacing:.5px; box-shadow:0 5px 14px rgba(54,95,190,.25); animation:brandGlow 3s ease-in-out infinite; }
  .brand-pill b{color:#FFE96A}.brand-atom{display:inline-block;animation:spin 5s linear infinite}
  @keyframes brandGlow { 50%{box-shadow:0 6px 22px rgba(124,92,231,.48);transform:translateY(-2px)} }
  .cloud {
    position: absolute;
    font-size: 2.2rem;
    opacity: 0.55;
    animation: drift 6s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translateX(-10px); }
    to { transform: translateX(10px); }
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    position: relative;
    z-index: 10;
  }
  h1 {
    font-size: 1.8rem;
    font-weight: 800;
    color: #2B6CB0;
    margin: 0;
  }
  .score-badge {
    background: #FEF3C7;
    color: #B45309;
    border-radius: 999px;
    padding: 6px 16px;
    font-weight: 700;
    font-size: 1.1rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .score-pop { animation: scorePop 0.4s ease; }
  @keyframes scorePop {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .progress-text {
    text-align: center;
    color: #64748B;
    font-weight: 600;
    margin: 0 0 12px 0;
    position: relative;
    z-index: 10;
  }
  .card {
    position: relative;
    z-index: 10;
    background: white;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    border: 4px solid #F1F5F9;
    margin: 0 auto;
    max-width: 420px;
    padding: 28px;
    text-align: center;
  }
  .card.correct {
    animation: bounceCorrect 0.5s ease;
    border-color: #4CAF7D !important;
  }
  .card.wrong {
    animation: shakeWrong 0.4s ease;
    border-color: #FF6F59 !important;
  }
  @keyframes bounceCorrect {
    0% { transform: scale(1); }
    35% { transform: scale(1.06); }
    65% { transform: scale(0.97); }
    100% { transform: scale(1); }
  }
  @keyframes shakeWrong {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .equation {
    font-size: 2.4rem;
    font-weight: 800;
    color: #334155;
    margin-bottom: 16px;
  }
  .icons-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .icon-box {
    border-radius: 16px;
    padding: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    max-width: 220px;
  }
  .icon-box.a { background: #FFF1F0; }
  .icon-box.b { background: #EAF7FF; }
  .icon-box.sub { background: #F5F0FF; }
  .plus-sign {
    font-size: 1.5rem;
    font-weight: 700;
    color: #94A3B8;
  }
  .icon-item {
    display: inline-block;
    font-size: 1.6rem;
    opacity: 0;
    animation: popIn 0.35s ease-out forwards;
  }
  .icon-item.crossed {
    opacity: 0.3 !important;
    text-decoration: line-through;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.3); }
    to { opacity: 1; transform: scale(1); }
  }
  .feedback {
    font-weight: 700;
    font-size: 1.15rem;
    margin-bottom: 12px;
    height: 1.4rem;
  }
  .feedback.correct { color: #059669; }
  .feedback.wrong { color: #F43F5E; }
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .choice-btn {
    border: 2px solid #E2E8F0;
    background: white;
    color: #334155;
    border-radius: 16px;
    padding: 14px;
    font-size: 1.6rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    font-family: inherit;
  }
  .choice-btn:active { transform: scale(0.94); }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct-choice {
    background: #D1FAE5;
    border-color: #34D399;
    color: #047857;
  }
  .choice-btn.wrong-choice {
    background: #FFE4E6;
    border-color: #FB7185;
    color: #E11D48;
  }
  .skip-btn {
    margin-top: 16px;
    width: 100%;
    background: none;
    border: none;
    color: #94A3B8;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }
  .skip-btn:hover { color: #64748B; }
  .confetti-piece {
    position: absolute;
    top: 0;
    font-size: 1.4rem;
    animation: confettiFall 1s ease-in forwards;
    z-index: 30;
    pointer-events: none;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(220px) rotate(360deg); opacity: 0; }
  }
  .result-card {
    position: relative;
    z-index: 10;
    background: white;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    border: 4px solid #F1F5F9;
    margin: 0 auto;
    max-width: 420px;
    padding: 32px;
    text-align: center;
  }
  .trophy {
    font-size: 4rem;
    margin-bottom: 8px;
    animation: popTrophy 0.6s ease-out;
  }
  @keyframes popTrophy {
    0% { opacity: 0; transform: scale(0.4) rotate(-8deg); }
    60% { opacity: 1; transform: scale(1.15) rotate(4deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  .result-title { font-size: 1.6rem; font-weight: 800; color: #334155; margin: 4px 0; }
  .result-msg { color: #64748B; margin-bottom: 16px; }
  .result-score { font-size: 3rem; font-weight: 800; color: #2B6CB0; margin-bottom: 4px; }
  .result-pct { color: #94A3B8; margin-bottom: 20px; }
  .bar-bg {
    width: 100%;
    background: #F1F5F9;
    border-radius: 999px;
    height: 16px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .bar-fill {
    height: 16px;
    border-radius: 999px;
    background: linear-gradient(90deg, #4CAF7D, #FFC857);
    width: 0%;
    transition: width 0.8s ease-out;
  }
  .restart-btn {
    width: 100%;
    padding: 14px;
    border-radius: 16px;
    font-size: 1.3rem;
    font-weight: 700;
    color: white;
    background: #4CAF7D;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    font-family: inherit;
  }
  .restart-btn:active { transform: scale(0.97); }

  .start-card {
    position: relative; z-index: 10; background: white; border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 4px solid #F1F5F9;
    margin: 30px auto 0; max-width: 420px; padding: 32px; text-align: center;
  }
  .start-emoji { font-size: 4rem; margin-bottom: 8px; }
  .start-emoji { animation:heroBounce 2.2s ease-in-out infinite; }
  @keyframes heroBounce { 50%{transform:translateY(-9px) rotate(3deg)} }
  .start-title { font-size: 1.8rem; font-weight: 800; color: #2B6CB0; margin-bottom: 8px; }
  .start-sub { color:#64748B; line-height:1.7; margin-bottom:18px; }
  .name-input {
    width: 100%; padding: 14px 16px; border: 2px solid #CBD5E1; border-radius: 14px;
    font-size: 1.2rem; text-align: center; font-family: inherit; outline: none;
  }
  .name-input:focus { border-color:#60A5FA; box-shadow:0 0 0 4px rgba(96,165,250,.15); }
  .start-btn {
    width:100%; margin-top:14px; padding:14px; border:none; border-radius:16px;
    font-size:1.25rem; font-weight:800; color:white; background:#4CAF7D; cursor:pointer; font-family:inherit;
  }
  .start-btn:active { transform:scale(.97); }
  .player-line { text-align:center; color:#475569; font-weight:700; margin:-2px 0 10px; position:relative; z-index:10; }

  @media (max-width:560px){ body{padding:8px}.app{padding:18px 14px;min-height:610px}.rainbow{opacity:.65}.ferris-wheel{opacity:.65}.school-bus{font-size:3rem}h1{font-size:1.45rem}.card,.start-card,.result-card{padding:22px 18px} }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important} }

</style>
</head>
<body>

<div class="world-bg" aria-hidden="true">
  <div class="aurora one"></div><div class="aurora two"></div><div class="rainbow"></div>
  <div class="pennants"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <span class="bg-cloud c1">☁️</span><span class="bg-cloud c2">☁️</span><span class="bg-cloud c3">☁️</span>
  <div class="ferris-wheel"><span>🎈</span><span>🎠</span><span>🍭</span><span>🎡</span></div>
  <div class="school-bus">🚌</div><div class="paper-plane">🛩️</div>
  <div id="dynamicBackground"></div><div class="wave"></div><div class="wave w2"></div>
</div>

<div class="app" id="app">
  <span class="cloud" style="top:12px; left:8%;">☁️</span>
  <span class="cloud" style="top:28px; right:10%; animation-delay:1.5s;">☁️</span>

  <div class="brand-strip"><div class="brand-pill"><span class="brand-atom">✨</span><b>GETECH</b> 巨研科技・小一數學大挑戰</div></div>

  <div class="header">
    <h1>小一加減法樂園</h1>
    <div class="score-badge" id="scoreBadge">⭐ 0</div>
  </div>

  <p class="progress-text" id="progressText">第 1 / 20 題</p>

  <div id="cardArea"></div>
</div>

<script>
  const EMOJIS = ["🍎", "🍓", "🎈", "⭐", "🐝", "🍭", "🚗", "🐣"];
  const TOTAL_QUESTIONS = 20;

  function buildBackground() {
    const layer = document.getElementById("dynamicBackground");
    const floaters = ["🎈","🫧","🎒","✏️","📚","📏","🧸","🧩","🎠","🎡","🍿","🍭","🏫","⭐","🔢","🖍️"];
    for (let i = 0; i < 30; i++) {
      const el = document.createElement("span");
      el.className = "float-item";
      el.textContent = floaters[i % floaters.length];
      el.style.left = ((i * 37) % 96) + "%";
      el.style.fontSize = (1.1 + (i % 5) * .25) + "rem";
      el.style.animationDuration = (12 + (i % 8) * 2.2) + "s";
      el.style.animationDelay = (-i * 1.35) + "s";
      layer.appendChild(el);
    }
    for (let i = 0; i < 24; i++) {
      const star = document.createElement("span");
      star.className = "spark";
      star.textContent = i % 3 ? "✦" : "✧";
      star.style.left = ((i * 43) % 97) + "%";
      star.style.top = ((i * 29) % 90) + "%";
      star.style.animationDelay = (-i * .17) + "s";
      star.style.fontSize = (10 + (i % 4) * 4) + "px";
      layer.appendChild(star);
    }
  }

  let score = 0;
  let questionNumber = 1;
  let problem = null;
  let status = "idle"; // idle | correct | wrong
  let selected = null;
  let playerName = "";

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateProblem() {
    const emoji = EMOJIS[randInt(0, EMOJIS.length - 1)];
    const useAddition = Math.random() < 0.5;
    let a, b, op, answer;

    if (useAddition) {
      a = randInt(1, 9);
      b = randInt(1, 9);
      op = "+";
      answer = a + b;
    } else {
      a = randInt(2, 18);
      b = randInt(1, Math.min(a, 9));
      op = "-";
      answer = a - b;
    }

    const choiceSet = new Set([answer]);
    let guard = 0;
    while (choiceSet.size < 4 && guard < 30) {
      guard++;
      const delta = randInt(-4, 4);
      let c = answer + delta;
      if (c < 0) c = answer + randInt(1, 5);
      choiceSet.add(c);
    }
    const choices = Array.from(choiceSet).sort(() => Math.random() - 0.5);

    return { a, b, op, answer, choices, emoji };
  }

  function resultInfo(finalScore) {
    const pct = Math.round((finalScore / TOTAL_QUESTIONS) * 100);
    if (pct >= 90) return { emoji: "🏆", msg: "太厲害了，小小數學博士！" };
    if (pct >= 70) return { emoji: "🥈", msg: "表現得很好，繼續保持！" };
    if (pct >= 50) return { emoji: "👍", msg: "不錯喔，再加油一點點！" };
    return { emoji: "💪", msg: "再多練習幾次，會越來越棒！" };
  }

  function renderIconRow(count, emoji, crossedCount) {
    crossedCount = crossedCount || 0;
    let html = "";
    for (let i = 0; i < count; i++) {
      const isCrossed = i >= count - crossedCount;
      html += `<span class="icon-item${isCrossed ? " crossed" : ""}" style="animation-delay:${i * 0.05}s">${emoji}</span>`;
    }
    return html;
  }

  function updateScoreBadge() {
    const badge = document.getElementById("scoreBadge");
    badge.textContent = "⭐ " + score;
    badge.classList.remove("score-pop");
    void badge.offsetWidth;
    badge.classList.add("score-pop");
  }

  function spawnConfetti() {
    const app = document.getElementById("app");
    const pieces = ["🎉", "⭐", "🎊", "✨"];
    for (let i = 0; i < 14; i++) {
      const span = document.createElement("span");
      span.className = "confetti-piece";
      span.textContent = pieces[i % 4];
      span.style.left = randInt(5, 95) + "%";
      span.style.animationDelay = (Math.random() * 0.3) + "s";
      app.appendChild(span);
      setTimeout(() => span.remove(), 1200);
    }
  }

  function renderProblemCard() {
    const cardArea = document.getElementById("cardArea");

    let bodyHtml = "";
    if (problem.op === "+") {
      bodyHtml = `
        <div class="icons-row">
          <div class="icon-box a">${renderIconRow(problem.a, problem.emoji)}</div>
          <span class="plus-sign">+</span>
          <div class="icon-box b">${renderIconRow(problem.b, problem.emoji)}</div>
        </div>`;
    } else {
      bodyHtml = `
        <div class="icons-row">
          <div class="icon-box sub">${renderIconRow(problem.a, problem.emoji, problem.b)}</div>
        </div>`;
    }

    let feedbackHtml = `<div class="feedback"></div>`;
    if (status === "correct") {
      feedbackHtml = `<div class="feedback correct">答對了！好棒 🎉</div>`;
    } else if (status === "wrong") {
      feedbackHtml = `<div class="feedback wrong">再試一次看看！</div>`;
    }

    let choicesHtml = `<div class="choices">`;
    problem.choices.forEach((choice) => {
      let cls = "choice-btn";
      if (selected === choice && status === "correct") cls += " correct-choice";
      else if (selected === choice && status === "wrong") cls += " wrong-choice";
      const disabled = status !== "idle" ? "disabled" : "";
      choicesHtml += `<button class="${cls}" ${disabled} onclick="handleSelect(${choice})">${choice}</button>`;
    });
    choicesHtml += `</div>`;

    const cardStateClass = status === "correct" ? "correct" : status === "wrong" ? "wrong" : "";

    cardArea.innerHTML = `
      <div class="card ${cardStateClass}">
        <div class="equation">${problem.a} ${problem.op} ${problem.b} = ?</div>
        ${bodyHtml}
        ${feedbackHtml}
        ${choicesHtml}
        <button class="skip-btn" onclick="skipProblem()">🔄 換一題</button>
      </div>
    `;

    document.getElementById("progressText").style.display = "block";
    document.getElementById("progressText").textContent = `${playerName}｜第 ${questionNumber} / ${TOTAL_QUESTIONS} 題`;
  }

  function renderResultCard() {
    const cardArea = document.getElementById("cardArea");
    document.getElementById("progressText").style.display = "none";
    const info = resultInfo(score);
    const pct = Math.round((score / TOTAL_QUESTIONS) * 100);

    cardArea.innerHTML = `
      <div class="result-card">
        <div class="trophy">${info.emoji}</div>
        <div class="result-title">${playerName || "小小挑戰者"}，全部完成！</div>
        <div class="result-msg">${info.msg}</div>
        <div class="result-score">${score} / ${TOTAL_QUESTIONS}</div>
        <div class="result-pct">答對率 ${pct}%</div>
        <div class="bar-bg"><div class="bar-fill" id="barFill"></div></div>
        <button class="restart-btn" onclick="restart()">🔄 再玩一次</button>
      </div>
    `;
    requestAnimationFrame(() => {
      document.getElementById("barFill").style.width = pct + "%";
    });
  }

  function nextProblem() {
    problem = generateProblem();
    status = "idle";
    selected = null;
    renderProblemCard();
  }

  function skipProblem() {
    if (status !== "idle") return;
    nextProblem();
  }

  function handleSelect(choice) {
    if (status !== "idle") return;
    selected = choice;

    if (choice === problem.answer) {
      status = "correct";
      score += 1;
      updateScoreBadge();
      renderProblemCard();
      spawnConfetti();
      setTimeout(() => {
        if (questionNumber >= TOTAL_QUESTIONS) {
          renderResultCard();
        } else {
          questionNumber += 1;
          nextProblem();
        }
      }, 1300);
    } else {
      status = "wrong";
      renderProblemCard();
      setTimeout(() => {
        status = "idle";
        selected = null;
        renderProblemCard();
      }, 650);
    }
  }

  function renderStart() {
    score = 0;
    questionNumber = 1;
    status = "idle";
    selected = null;
    document.getElementById("scoreBadge").textContent = "⭐ 0";
    document.getElementById("progressText").style.display = "none";
    document.getElementById("cardArea").innerHTML = `
      <div class="start-card">
        <div class="start-emoji">🎒➕➖</div>
        <div class="start-title">小一數學大挑戰</div>
        <div class="start-sub">先輸入你的名字，再來挑戰 20 題加減法！<br>答對會加星星，答錯也可以再試一次喔 ✨</div>
        <input id="nameInput" class="name-input" maxlength="12" placeholder="請輸入名字或暱稱">
        <button class="start-btn" onclick="startGame()">🚀 開始挑戰</button>
      </div>`;
    setTimeout(() => { const el = document.getElementById("nameInput"); if (el) el.focus(); }, 50);
  }

  function startGame() {
    const input = document.getElementById("nameInput");
    const name = (input?.value || "").trim();
    playerName = name || "小小挑戰者";
    score = 0;
    questionNumber = 1;
    updateScoreBadge();
    nextProblem();
  }

  function restart() {
    renderStart();
  }


  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && document.getElementById("nameInput")) startGame();
  });

  // init
  buildBackground();
  renderStart();
</script>

</body>
</html>
